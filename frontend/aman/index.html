<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F6F8">
  <title>AMAN Bank — больше чем банк</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="brand" href="#" aria-label="AMAN Bank"><span class="logo-icon">A<span></span></span><span>AMAN<span class="brand-bank"> BANK</span></span></a>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Включить тёмную тему"></button>
        <button class="icon-btn signed-in" data-page="invitations" aria-label="Уведомления" hidden><span data-icon="bell"></span><i class="notification-dot"></i></button>
        <button class="avatar signed-in" data-page="profile" aria-label="Открыть профиль" hidden>А</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Основная навигация" hidden></nav>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><h2 id="modal-title"></h2><button class="icon-btn" id="closeModal" aria-label="Закрыть"><span data-icon="close"></span></button></div><div id="modal-content"></div></dialog>
  <noscript>Включите JavaScript, чтобы посмотреть интерактивный прототип.</noscript>
</body>
</html>
